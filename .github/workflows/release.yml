# Release pipeline — runs ONLY when a version tag v<MAJOR>.<MINOR>.<PATCH> is pushed (see RELEASING.md).
# Versions are strictly x.x.x (TLM accepts no other format); every 0.x version is published as a GitHub pre-release.
# The build job runs with read-only permissions and no cache; only the publish job may write, and it runs no
# project code. Actions are pinned to commit SHAs; the comment names the release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main"; exit 1
          fi

      - name: Tag must be x.x.x and match the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be x.x.x (TLM accepts no other format): $version"; exit 1
          fi
          pom=$(mvn -B -q -s settings.xml help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$version" != "$pom" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $pom"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          mkdir dist
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"; exit 1
          fi

      - name: Resolve dependencies (runs no project or SDK code)
        run: mvn -B -s settings.xml --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:resolve

      - name: TLM SDK artifacts match the pinned checksums (before any SDK code runs)
        run: scripts/verify-sdk.sh

      - name: Test and build
        run: |
          mvn -B -s settings.xml --no-transfer-progress clean package
          scripts/check-public.sh

      - name: Collect release assets
        run: |
          cp "plugin-dist/kemp-loadmaster-tlm-plugin-$VERSION.zip" configuration.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/configuration.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$version" in 0.*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kemp LoadMaster TLM plugin $version" \
            --notes-file release-notes.md \
            --verify-tag "${prerelease[@]}"
